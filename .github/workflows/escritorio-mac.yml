# Arma la app de escritorio para Mac en Macs de GitHub: corre las pruebas y
# genera el .dmg y el .zip para Apple Silicon (arm64) e Intel (x64).
#
# Cada arquitectura en su propia maquina: ffmpeg-static baja el ffmpeg de la
# maquina donde corre npm install, y un .dmg x64 armado en una Mac M1
# llevaria ffmpeg arm64 (build/mac/firmar-adhoc.js corta el build si pasa).
#
# Sin firma de Apple ni notarizacion, sin secretos y sin publicar nada: los
# instaladores quedan como "artifacts" de la corrida (ver escritorio/README.md).

name: Escritorio Mac

on:
  workflow_dispatch:
  push:
    paths:
      - 'escritorio/**'
      - '.github/workflows/escritorio-mac.yml'

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
            lipo: arm64
          - runner: macos-15-intel  # Intel (macos-13 ya no existe en GitHub)
            arch: x64
            lipo: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: escritorio/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: |
          set -o pipefail
          node --test --test-reporter=tap "test/*.test.js" 2>&1 | tee pruebas.log
        # Tardan segundos: si algo queda colgado (un servidor abierto), que no
        # espere las 6 horas por defecto de GitHub.
        timeout-minutes: 10

      - name: Armar .dmg y .zip
        run: |
          set -o pipefail
          npm run dist:mac -- --${{ matrix.arch }} 2>&1 | tee armado.log
        env:
          # Sin certificado: que electron-builder no busque uno en el llavero.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Si algo falla, queda como anotacion en la pagina de la corrida (se ve
      # sin iniciar sesion y sin abrir el log entero). El nombre va en el
      # mensaje y no en title=: ahi las comas y los ":" cortan la anotacion.
      - name: Anotar lo que fallo
        if: failure()
        run: |
          esc() { sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }'; }
          if [ -f pruebas.log ]; then
            awk '
              /^ *not ok / { if (n) print b; b=$0; sub(/^ *not ok [0-9]+ - /, "PRUEBA: ", b); n=1; next }
              n && /^ *(error|location|expected|actual):/ { l=$0; sub(/^ */, "", l); b = b "\n  " l }
              END { if (n) print b }
            ' pruebas.log | awk 'BEGIN{RS="PRUEBA: "} NR>1 { print "PRUEBA: " $0 > ("falla-" NR ".txt") }'
            for f in falla-*.txt; do [ -f "$f" ] && echo "::error::$(esc < "$f")"; done | head -n 15
          fi
          if [ -f armado.log ]; then echo "::error::ARMADO (ultimas lineas)%0A$(tail -n 30 armado.log | esc)"; fi

      - name: Verificar ffmpeg y ffprobe adentro de la .app
        run: |
          app="$(find dist -maxdepth 2 -name '*.app' -type d | head -n 1)"
          echo "App: $app"
          test -n "$app"
          fallo=0
          # El nombre de la app tiene espacios ("Tag & View Pro.app"): se recorre
          # con -print0 para no partir las rutas.
          while IFS= read -r -d '' bin; do
            archs="$(lipo -archs "$bin")"
            echo "$bin → $archs"
            codesign -dv "$bin" 2>&1 | head -n 3 || true
            case " $archs " in
              *" ${{ matrix.lipo }} "*) ;;
              # ffprobe-static no trae ffprobe arm64: corre con Rosetta 2 (ver
              # build/mac/firmar-adhoc.js). ffmpeg sí tiene que ser arm64.
              " x86_64 ") if [ "${{ matrix.lipo }}" = arm64 ] && [ "$(basename "$bin")" = ffprobe ]; then
                            echo "::warning::ffprobe es x86_64 en el .dmg arm64 (corre con Rosetta 2)"
                          else echo "::error::$bin es $archs, se esperaba ${{ matrix.lipo }}"; fallo=1; fi ;;
              *) echo "::error::$bin es $archs, se esperaba ${{ matrix.lipo }}"; fallo=1 ;;
            esac
          done < <(find "$app/Contents/Resources/app.asar.unpacked" -type f \( -name ffmpeg -o -name ffprobe \) -print0)
          exit $fallo

      - uses: actions/upload-artifact@v4
        with:
          name: tagview-mac-${{ matrix.arch }}
          path: |
            escritorio/dist/*.dmg
            escritorio/dist/*.zip
          if-no-files-found: error
          retention-days: 14
